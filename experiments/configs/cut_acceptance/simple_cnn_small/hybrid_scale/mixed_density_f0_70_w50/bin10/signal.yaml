# Hybrid-scale cut-acceptance run on simple_cnn_small.
# Spatial sampling: mixed_density (foveated vision). Each trial picks a
# random focus bin and concentrates 70% of its events inside a ±25 keV
# window around it; the remaining 30% are drawn globally. Goal: sharper
# β(E) near local features without losing global coverage.
# out_dir / name left blank — pipeline auto-derives them from the
# paradigm tag.

train_predictions_path: runs/small_data_configs/simple_cnn_small/eval_train/predictions.h5
validation_predictions_path: runs/small_data_configs/simple_cnn_small/eval/predictions.h5
upstream_classifier_config: configs/small_data_configs/simple_cnn_small.yaml

target_class: 1
energy_range: [500.0, 3000.0]
energy_bin_width: 10.0
threshold_range: [0.0, 1.0]

min_events_per_bin: 4

# Hybrid-scale: mixed_density at 70% local fraction, ±25 keV window.
sampling_pattern: mixed_density
zoom_window_width_kev: 50.0
local_event_fraction: 0.70
trial_size_strategy: fixed

encoder:
  type: mlp
  latent_dim: 64
  hidden_dims: [128, 128]
  dropout: 0.1

cnp:
  n_context_min: 2
  n_context_max: 32
  output_activation: sigmoid
  mixup_alpha: 0.01

training:
  n_steps: 3000
  learning_rate: 1.0e-3
  batch_size: 16
  n_events_per_trial: 48
  n_mc_samples: 4
  grad_clip: 1.0
  eval_every: 0
  eval_batch_size: 32
  eval_n_events: 64
  seed: 0

decoder_hidden_dims: [128, 128, 128]
