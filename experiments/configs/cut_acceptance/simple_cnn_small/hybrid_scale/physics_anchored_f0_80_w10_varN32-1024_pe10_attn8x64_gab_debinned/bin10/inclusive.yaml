# Cell 2 — PE10 + cross-attention + Gaussian Attention Bias (GAB) +
# **continuous de-binned sampler**. Identical to Cell 1 except for the
# sampler density mode.
#
# The continuous mode replaces the legacy bin-stratified two-step
# draw (uniform-over-kept-bins → uniform-within-bin) with:
#   * Global: inverse-density-weighted draw over the full kept-event
#     pool. Per-event weight W_i = 1 / |{j : |E_j − E_i| ≤ 10 keV}|,
#     normalised to sum to 1. Sparse-energy regions get up-weighted;
#     dense regions get down-weighted.
#   * Local (the f_local=0.80 fraction): uniform draw, with
#     replacement, from kept events satisfying |E − E_focus| ≤ 5 keV
#     (strict absolute filter, no half-bin pad).
#
# This removes the 10-keV staircase in the marginal P(E_context) of
# the training stream. If the high-E sawtooth was driven (in part) by
# the sub-bin density discontinuities of the bin-stratified draw, this
# cell should show a smoother high-E β(E) than Cell 1. If the sawtooth
# persists at the same amplitude, the binning is exonerated and the
# remaining driver is the PE bandwidth / Bernoulli noise resonance.
#
# Paradigm tag (auto-derived):
#   hybrid_scale/physics_anchored_f0_80_w10_varN32-1024_pe10_attn8x64_gab_debinned

train_predictions_path: runs/small_data_configs/simple_cnn_small/eval_train/predictions.h5
validation_predictions_path: runs/small_data_configs/simple_cnn_small/eval/predictions.h5
upstream_classifier_config: configs/small_data_configs/simple_cnn_small.yaml

target_class: "all"
energy_range: [500.0, 3000.0]
energy_bin_width: 10.0
threshold_range: [0.0, 1.0]

min_events_per_bin: 4

sampling_pattern: physics_anchored
zoom_window_width_kev: 10.0
local_event_fraction: 0.80
physics_peaks_kev: [1592.0, 1620.0, 2103.0, 2614.0]
trial_size_strategy: variable_uniform
n_trial_events_min: 32
n_trial_events_max: 1024

density_sampling: continuous
density_kde_radius_kev: 10.0

encoder:
  type: mlp
  latent_dim: 64
  hidden_dims: [128, 128]
  dropout: 0.1

cnp:
  n_context_min: 2
  n_context_max: 1023
  output_activation: sigmoid
  mixup_alpha: 0.01

training:
  n_steps: 3000
  learning_rate: 1.0e-3
  batch_size: 16
  n_events_per_trial: 512    # ignored under variable_uniform
  n_mc_samples: 4
  grad_clip: 1.0
  eval_every: 0
  eval_batch_size: 32
  eval_n_events: 64
  seed: 0

decoder_hidden_dims: [128, 128, 128]

positional_encoding:
  enabled: true
  num_bands: 10
  min_energy_kev: 500.0
  max_energy_kev: 3000.0

aggregator:
  type: cross_attention
  num_heads: 8
  attention_dim: 64
  gaussian_attention_bias: true
