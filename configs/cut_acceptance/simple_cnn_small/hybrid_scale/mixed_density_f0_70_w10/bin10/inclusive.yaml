# Inclusive sibling of the bin10/signal cell — same paradigm knobs,
# only the label filter differs (target_class="all"). Generated as
# part of the per-paradigm inclusive audit (analysis/cnp_audit/
# _audit_inclusive_result.md).
# Hybrid-scale w10_fixed48: shrink the focus window to HPGe-relevant
# 10 keV (matching typical peak FWHM scales), keep fixed N=48 events
# per trial. Direct A/B against the True-CNP baseline.
# out_dir / name are auto-derived from the canonical paradigm tag.

train_predictions_path: runs/small_data_configs/simple_cnn_small/eval_train/predictions.h5
validation_predictions_path: runs/small_data_configs/simple_cnn_small/eval/predictions.h5
upstream_classifier_config: configs/small_data_configs/simple_cnn_small.yaml

target_class: "all"
energy_range: [500.0, 3000.0]
energy_bin_width: 10.0
threshold_range: [0.0, 1.0]

min_events_per_bin: 4

# Spatial: ±5 keV focus, 70% local.
sampling_pattern: mixed_density
zoom_window_width_kev: 10.0
local_event_fraction: 0.70
# Trial size: fixed N=48 (training.n_events_per_trial below).
trial_size_strategy: fixed

encoder:
  type: mlp
  latent_dim: 64
  hidden_dims: [128, 128]
  dropout: 0.1

cnp:
  n_context_min: 2
  n_context_max: 32
  output_activation: sigmoid
  mixup_alpha: 0.01

training:
  n_steps: 3000
  learning_rate: 1.0e-3
  batch_size: 16
  n_events_per_trial: 48
  n_mc_samples: 4
  grad_clip: 1.0
  eval_every: 0
  eval_batch_size: 32
  eval_n_events: 64
  seed: 0

decoder_hidden_dims: [128, 128, 128]
