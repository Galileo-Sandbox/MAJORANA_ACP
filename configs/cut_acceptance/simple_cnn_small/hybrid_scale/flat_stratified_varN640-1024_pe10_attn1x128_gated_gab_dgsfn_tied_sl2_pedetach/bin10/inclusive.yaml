# Cell 12 — High-Contrast Gating (σ_local = 2 keV).
#
# Cell 11's empirical breakthrough eliminated the continuum sawtooth
# entirely (MASD 0.0038 vs Cell 10's 0.296 — a 75× drop) by closing
# every PE10 bypass and forcing the SFN to be load-bearing. But the
# SE 2103 (Z=-26.7) and DEP 1592 (Z=+18.7) peaks collapsed because
# the SFN's two-feature input ``[log ρ_local, log ρ_global]`` was
# physically blind to those peaks.
#
# Diagnosis from the σ probe: σ(E_*) varied only ~5 keV across the
# spectrum (194 → 200 keV), dropping sharply only at the 2800 keV
# sparse tail (σ = 14 keV). The MLP found a 1D "data-sparsity"
# decision rule but never a "peak vs continuum" decision rule.
#
# Root cause: the pool-density kernel uses ``σ_local = 10 keV`` —
# five times wider than the ~2 keV physical FWHM of HPGe γ-peaks
# in this energy range. A 10-keV Gaussian convolved against a sharp
# γ-line smears the peak density across ~50 keV of adjacent Compton
# continuum, so ρ_local at SE 2103 differs from ρ_local at 1850 keV
# (smooth continuum) by only a factor of ~1.8 — log_l contrast ≈ 0.5,
# insufficient signal for the SFN.
#
# Cell 12 corrects this physical mismatch: ``σ_local = 2 keV`` so
# the kernel resolution matches the detector resolution. Expected:
#   * ρ_local at SE/DEP ≈ √(σ_l_old / σ_l_new) × peak height
#     → log_l contrast jumps from ~0.5 to ~3-4.
#   * SFN finally has enough signal to learn σ → σ_min at SE and DEP.
#   * MASD in the continuum should stay near the Cell-11 floor
#     because the smooth-continuum regime is unchanged.
#
# Architecture, sampler, decoder gating, PE-detach, head-tying, NBLL
# loss — ALL identical to Cell 11. Single-knob A/B isolating the
# kernel-width correction.
#
# Paradigm tag (auto-derived; new ``sl2`` token marks non-default σ_l):
#   hybrid_scale/flat_stratified_varN640-1024_pe10_attn1x128_gated_gab_dgsfn_tied_sl2_pedetach

train_predictions_path: runs/small_data_configs/simple_cnn_small/eval_train/predictions.h5
validation_predictions_path: runs/small_data_configs/simple_cnn_small/eval/predictions.h5
upstream_classifier_config: configs/small_data_configs/simple_cnn_small.yaml

target_class: "all"
energy_range: [500.0, 3000.0]
energy_bin_width: 10.0
threshold_range: [0.0, 1.0]

min_events_per_bin: 4

sampling_pattern: flat_stratified
trial_size_strategy: variable_uniform
n_trial_events_min: 640
n_trial_events_max: 1024

density_sampling: bin_stratified

encoder:
  type: mlp
  latent_dim: 64
  hidden_dims: [128, 128]
  dropout: 0.1

cnp:
  n_context_min: 128
  n_context_max: 512
  output_activation: sigmoid
  mixup_alpha: 0.01

training:
  n_steps: 3000
  learning_rate: 1.0e-3
  batch_size: 16
  n_events_per_trial: 512    # ignored under variable_uniform
  n_mc_samples: 4
  grad_clip: 1.0
  eval_every: 0
  eval_batch_size: 32
  eval_n_events: 64
  seed: 0

decoder_hidden_dims: [128, 128, 128]

positional_encoding:
  enabled: true
  num_bands: 10
  min_energy_kev: 500.0
  max_energy_kev: 3000.0

aggregator:
  type: cross_attention
  num_heads: 1
  attention_dim: 128
  decoder_coordinate_gating: true
  gaussian_attention_bias: true
  pe_detach_qk: true
  pool_density_sfn:
    enabled: true
    sigma_max_kev: 200.0
    sigma_min_kev: 5.0
    hidden_dim: 16
    sigma_local_kev: 2.0          # ← Cell 12: matches HPGe FWHM (~2 keV)
    sigma_global_kev: 150.0
    epsilon: 1.0e-5
    temperature_gating: true
    tau_min_value: 1.0
    tau_max_value: 10.0
    head_tied: true
