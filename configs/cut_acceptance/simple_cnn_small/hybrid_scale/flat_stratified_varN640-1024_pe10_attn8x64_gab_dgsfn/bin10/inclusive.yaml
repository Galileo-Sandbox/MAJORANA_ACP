# Cell 8 — Dual-Gated Absolute Density SFN (DG-SFN).
#
# Strict structural extension of Cell 7 that closes the asymmetric
# loophole identified by the Cell 7 empirical run: when σ_head
# saturates at σ_max in flat continuum, the spatial penalty term
# Δ²/(2σ²) collapses to ~0 and the attention score degenerates to
# Q·K^T/√d — leaving the raw PE10-driven Fourier features free to
# produce sharp attention peaks against shot noise. Cell 7 trained
# on flat_stratified showed continuum MASD = 0.29 in the 1.7-2.0 MeV
# region — 3.7× higher than Cell 6's SFN MASD = 0.08 in the same
# region.
#
# Cell 8 introduces a SECOND SFN output head — a per-target
# temperature τ_head(E_*) ∈ [1, 10] that scales Q·K^T BEFORE the
# softmax:
#
#   Z_*       = [log(ρ_local + ε), log(ρ_global + ε)]
#   σ_head(E_*) = 5 + 195 · sigmoid(MLP_σ(Z_*))     ∈ [5, 200] keV
#   τ_head(E_*) = 1 + 9   · sigmoid(MLP_τ(Z_*))     ∈ [1,  10]
#   score_{*,i} = (Q_* K_i^T) / (√d_k · τ_head) − Δ²/(2 σ_head²)
#
# Intuition:
#   * Continuum vacuum: σ_head → σ_max (penalty → 0) AND τ_head →
#     τ_max simultaneously. The dual gate flattens both the spatial
#     penalty AND the raw QK^T sharpness, physically preventing
#     PE10 from fitting bin-scale shot noise.
#   * Real γ-peaks: σ_head → σ_min (sharp focus) AND τ_head → τ_min
#     = 1 (recovers standard softmax). The model retains Cell 7's
#     peak-resolution behavior; Cell 7 is mathematically Cell 8 with
#     τ_max = τ_min = 1.
#
# Pool, sampler, PE10, σ bounds — all identical to Cell 7 so the A/B
# isolates the temperature gate's contribution.
#
# Paradigm tag (auto-derived):
#   hybrid_scale/flat_stratified_varN640-1024_pe10_attn8x64_gab_dgsfn

train_predictions_path: runs/small_data_configs/simple_cnn_small/eval_train/predictions.h5
validation_predictions_path: runs/small_data_configs/simple_cnn_small/eval/predictions.h5
upstream_classifier_config: configs/small_data_configs/simple_cnn_small.yaml

target_class: "all"
energy_range: [500.0, 3000.0]
energy_bin_width: 10.0
threshold_range: [0.0, 1.0]

min_events_per_bin: 4

sampling_pattern: flat_stratified
trial_size_strategy: variable_uniform
n_trial_events_min: 640
n_trial_events_max: 1024

density_sampling: bin_stratified

encoder:
  type: mlp
  latent_dim: 64
  hidden_dims: [128, 128]
  dropout: 0.1

cnp:
  n_context_min: 128
  n_context_max: 512
  output_activation: sigmoid
  mixup_alpha: 0.01

training:
  n_steps: 3000
  learning_rate: 1.0e-3
  batch_size: 16
  n_events_per_trial: 512    # ignored under variable_uniform
  n_mc_samples: 4
  grad_clip: 1.0
  eval_every: 0
  eval_batch_size: 32
  eval_n_events: 64
  seed: 0

decoder_hidden_dims: [128, 128, 128]

positional_encoding:
  enabled: true
  num_bands: 10
  min_energy_kev: 500.0
  max_energy_kev: 3000.0

aggregator:
  type: cross_attention
  num_heads: 8
  attention_dim: 64
  gaussian_attention_bias: true
  pool_density_sfn:
    enabled: true
    sigma_max_kev: 200.0
    sigma_min_kev: 5.0
    hidden_dim: 16
    sigma_local_kev: 10.0
    sigma_global_kev: 150.0
    epsilon: 1.0e-5
    temperature_gating: true
    tau_min_value: 1.0
    tau_max_value: 10.0
