# cell17 — Smoothly Constrained Adaptive Bandwidth (κ ∈ [1, 5])
#
# Delta vs cell15_v5 (locked SOTA):
#   hard_filter_lambda_min_trainable: false → true
#   hard_filter_lambda_min_constrain_range: null → [1.0, 5.0]
#   hard_filter_lambda_min: 1.0 → 3.0  (init κ at midpoint of [1,5])
#
# Parameter and gating formula (new):
#
#     self.kappa_raw = nn.Parameter(torch.tensor(0.0))
#     κ = 1.0 + 4.0 · sigmoid(self.kappa_raw)             ∈ (1, 5)
#     λ(E_*) = κ + (10.0 − κ) · sigmoid(10.0 · (R(E_*) − 3.0))
#
# Inverse-sigmoid init: kappa_raw=0 → sigmoid(0)=0.5 → κ=3.0
# (midpoint). Far from sigmoid saturation, so Adam has maximum
# initial gradient torque to find the optimal floor.
#
# Rationale: Cell 16's free κ might over-allocate high-frequency
# bandwidth to the continuum (band l=5+ open in flat regions),
# wrecking MASD. Cell 17 smoothly caps κ at 5 so the SUPREME
# bands (l=6..9) stay closed in the continuum even at maximum
# leakage. The sigmoid is fully differentiable everywhere — no
# clamp / vanishing-gradient pathology.
#
# Hypothesis: optimal κ lies in [2, 4]; bounded sigmoid steers
# the optimiser without locking out the boundary.

name: cell17_kappa_constrained_1to5
out_dir: results/cut_acceptance/simple_cnn_small/sweeps/cell17/bin10/inclusive

# ---- baseline carried over from cell15_v5 ----

train_predictions_path: runs/small_data_configs/simple_cnn_small/eval_train/predictions.h5
validation_predictions_path: runs/small_data_configs/simple_cnn_small/eval/predictions.h5
upstream_classifier_config: configs/small_data_configs/simple_cnn_small.yaml

target_class: "all"
energy_range: [500.0, 3000.0]
energy_bin_width: 10.0
threshold_range: [0.0, 1.0]

min_events_per_bin: 4

sampling_pattern: flat_stratified
trial_size_strategy: variable_uniform
n_trial_events_min: 640
n_trial_events_max: 1024

density_sampling: bin_stratified

encoder:
  type: mlp
  latent_dim: 64
  hidden_dims: [128, 128]
  dropout: 0.2

cnp:
  n_context_min: 128
  n_context_max: 512
  output_activation: sigmoid
  mixup_alpha: 0.01

training:
  n_steps: 3000
  learning_rate: 1.0e-3
  batch_size: 16
  n_events_per_trial: 512
  n_mc_samples: 4
  grad_clip: 1.0
  eval_every: 0
  eval_batch_size: 32
  eval_n_events: 64
  seed: 0

decoder_hidden_dims: [128, 128, 128]

positional_encoding:
  enabled: true
  num_bands: 10
  min_energy_kev: 500.0
  max_energy_kev: 3000.0

aggregator:
  type: cross_attention
  num_heads: 1
  attention_dim: 128
  decoder_coordinate_gating: true
  gaussian_attention_bias: true
  pe_detach_qk: true
  pool_density_sfn:
    enabled: true
    sigma_max_kev: 200.0
    sigma_min_kev: 5.0
    hidden_dim: 16
    sigma_local_kev: 1.0
    sigma_global_kev: 50.0
    epsilon: 1.0e-5
    temperature_gating: true
    tau_min_value: 1.0
    tau_max_value: 10.0
    head_tied: true
    hard_filter: true
    hard_filter_contrast_threshold: 3.0
    hard_filter_sigmoid_steepness: 10.0
    hard_filter_lambda_min: 3.0                       # ← κ init (midpoint)
    hard_filter_lambda_min_trainable: true            # ← Cell 17 lever
    hard_filter_lambda_min_constrain_range: [1.0, 5.0]
    hard_filter_lambda_max: 10.0
    inject_contrast_feature: true
