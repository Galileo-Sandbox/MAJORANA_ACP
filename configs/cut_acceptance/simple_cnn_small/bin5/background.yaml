# True-CNP cut-acceptance run on simple_cnn_small.
# 1D-regression CNP in EVENT_ONLY mode: per-event (E_i, T) in phi.
# Bin grid (5 keV) is used ONLY for sampling stratification at train
# time and for D_T binning at evaluation time; the CNP is grid-agnostic.
name: simple_cnn_small_bin5_background

train_predictions_path: runs/small_data_configs/simple_cnn_small/eval_train/predictions.h5
validation_predictions_path: runs/small_data_configs/simple_cnn_small/eval/predictions.h5
out_dir: results/cut_acceptance/simple_cnn_small/bin5/background

target_class: 0
energy_range: [500.0, 3000.0]
energy_bin_width: 5.0
threshold_range: [0.0, 1.0]

min_events_per_bin: 4

encoder:
  type: mlp
  latent_dim: 64
  hidden_dims: [128, 128]
  dropout: 0.1

cnp:
  n_context_min: 2
  n_context_max: 32
  output_activation: sigmoid
  mixup_alpha: 0.01

training:
  n_steps: 6000
  learning_rate: 1.0e-3
  batch_size: 16
  n_events_per_trial: 48
  n_mc_samples: 4
  grad_clip: 1.0
  eval_every: 0
  eval_batch_size: 32
  eval_n_events: 64
  seed: 0

decoder_hidden_dims: [128, 128, 128]
